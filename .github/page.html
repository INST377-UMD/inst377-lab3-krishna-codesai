<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lab 3 - Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="page-banner">
    <h1>Lab 3 – Rock Paper Scissors</h1>
  </header>

  <nav>
    <ul class="main-nav">
      <li><a href="https://www.nytimes.com/games/wordle/index.html" target="_blank">Wordle</a></li>
      <li><a href="https://gemini.google.com" target="_blank">Gemini</a></li>
      <li><a href="https://www.google.com" target="_blank">Google</a></li>
    </ul>
  </nav>

  <div class="content-wrapper">
    <main class="main-content">
        <h2>Please choose one of the following.</h2>
  
        <form>
          <label>Name</label>
          <input type="text" id="player-name" required />
  
          <br><br>
  
          <label>Your choice:</label>
          <select>
            <option>Rock</option>
            <option>Paper</option>
            <option>Scissors</option>
          </select>
  
          <br><br>
  
          <button type="submit">Submit</button>
        </form>
      </main>

      <aside class="sidebar">
        <h2>Rules</h2>
  
        <p>You must choose Rock, Paper or Scissors</p>
  
        <h3>The Combos are as follows:</h3>
        <ul>
          <li>Rock beats Scissors</li>
          <li>Scissors beats Paper</li>
          <li>Paper beats Rock</li>
        </ul>
      </aside>

  </div>
  <footer class="page-banner footer-text">
    I dont know what to say hello.
  </footer>

</body>
</html>
